plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = "26.1.2.30-beta"

    runs {
        client {
            client()
        }

        server {
            server()
        }
    }

    mods {
        teuteu {
            sourceSet(sourceSets.main)
        }
    }
}